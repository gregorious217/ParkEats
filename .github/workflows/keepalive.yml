# Supabase pauses free-tier projects after 7 days without activity.
# This pings the API twice a week so ParkEats stays awake.
# Add repository secrets SUPABASE_URL and SUPABASE_ANON_KEY (Settings -> Secrets and variables -> Actions).
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 15 * * 1,4'   # Mondays and Thursdays, 15:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl --fail --silent --show-error \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/food_types?select=id&limit=1"
